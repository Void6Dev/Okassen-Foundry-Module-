name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Тесты не требуют зависимостей: node:test + заглушки Foundry в tests/.
      - name: Run tests
        run: node --test "tests/*.test.mjs"
